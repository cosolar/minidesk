server:
  port: 18080
  shutdown: graceful

spring:
  servlet:
    multipart:
      # 备份包含附件与品牌资源，恢复包体积可能远大于普通上传
      max-file-size: 512MB
      max-request-size: 520MB
  application:
    name: minidesk
  datasource:
    # 默认 SQLite（本地开发 / 单 Jar 直跑），与 minidesk.data-dir 同源。
    # 生产切 MySQL 时由 deploy/.env 注入下面这组变量，方言与建表脚本一起切换，
    # 无需改镜像；也可用 SPRING_PROFILES_ACTIVE=mysql 走 application-mysql.yml。
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:${minidesk.data-dir}/minidesk.db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${MINIDESK_DB_POOL_SIZE:8}
      connection-init-sql: ${MINIDESK_DB_INIT_SQL:PRAGMA journal_mode=WAL;}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: ${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:db/schema-sqlite.sql}
      continue-on-error: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产不要输出 SQL：integration_config 等表含加密凭据，StdOutImpl 会把整行密文
    # （含参数）打进控制台日志。需要排查 SQL 时再临时改成 stdout 实现。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  type-handlers-package: cn.minims.desk.framework.mybatis.handler
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: MiniDesk-Token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: jwt
  is-read-header: true
  is-read-cookie: false
  jwt-secret-key: ${SA_TOKEN_SECRET:minidesk-dev-secret-please-override-in-prod}

minidesk:
  # 与 RestoreBootstrap 的启动参数保持一致；单 Jar 部署时建议改成绝对路径
  data-dir: ${MINIDESK_DATA_DIR:./data}
  # 可选：首次启动时把知识库 mdt_ 令牌加密写入 integration_config；已有配置不覆盖
  minidocs-token: ${MINIDESK_MINIDOCS_TOKEN:}
  weather:
    # 免费、无需 API Key 的数据源，按优先级尝试：
    # cma = 中国天气网实况（国内直连最快）；open-meteo = Open-Meteo（CC BY 4.0，海外/代理环境）
    # 海外部署可设为 MINIDESK_WEATHER_PROVIDERS=open-meteo,cma
    providers: ${MINIDESK_WEATHER_PROVIDERS:cma,open-meteo}
  register:
    # 公网部署时设置该环境变量，首个管理员注册需填写
    claim-token: ${MINIDESK_CLAIM_TOKEN:}

logging:
  level:
    cn.minims.desk: debug

name: Publish Docker image

# 发布官方单镜像到 Docker Hub：<DOCKERHUB_USERNAME>/minidesk
#
# 触发方式：
#   1) 打 tag 并推送：git tag v0.1.0 && git push origin v0.1.0  → 构建并推送 0.1.0 / 0.1 / latest
#   2) 在 Actions 页面手动 Run workflow（可关掉 push 只验证构建，也可填版本号）
#   3) 改动源码 / Dockerfile / deploy / 本工作流并推到 main          → 只验证构建，不推送
#      注：GitHub 对 tag 推送不评估 paths 过滤，所以打 tag 一定触发。
#
# 仓库需要配置两个 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub Access Token（不是登录密码）
# 未配置时，推送任务会在「检查凭据」这一步带着明确提示失败，而不是卡在登录。
#
# 镜像内容见仓库根 Dockerfile：多阶段构建 Vue 3 前端与 Spring Boot 单 Jar，
# 运行镜像只有一个 Java 进程，默认 SQLite，数据卷 /data。

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      push:
        description: '推送到 Docker Hub（关闭则只验证构建）'
        type: boolean
        default: true
      version:
        description: '版本号（如 0.1.0）。填写时额外推送 0.1.0 / 0.1；留空只推 latest'
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 只在「推版本 tag」或「手动勾选推送」时真正发布；main 上的构建与手动关闭推送时只验证。
      PUSH_IMAGE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'minimscn' }}/minidesk
    steps:
      - uses: actions/checkout@v4

      # 不在这里重复跑构建与检查：Dockerfile 自己会构建前端、编译后端，
      # 并在打包后校验 jar 内确实含有 static/index.html。
      - uses: docker/setup-buildx-action@v3

      # 缺少 Secrets 时给出可执行的提示，而不是让 login-action 报一句
      # 「Username and password required」，让人分不清是没配还是配错了。
      - name: Check Docker Hub credentials
        if: env.PUSH_IMAGE == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets：$missing。请在 Settings → Secrets and variables → Actions 中添加：DOCKERHUB_USERNAME（用户名）、DOCKERHUB_TOKEN（Docker Hub Access Token，需 Read & Write 权限）。添加后重新运行本工作流。"
            exit 1
          fi
          echo "Docker Hub 凭据已配置（用户名：$DOCKERHUB_USERNAME）"

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # semver 标签只能从 refs/tags/v* 推出来；手动运行没有 tag，
      # 所以允许显式填版本号，否则只会得到 latest。
      - name: Resolve manual version
        id: ver
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *.*.*) echo "minor=${v%.*}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.minor != '' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 纯 Java + 静态资源；与现有生产服务器架构一致，先只发 amd64。
          # 需要 Apple Silicon / ARM 服务器时改成 linux/amd64,linux/arm64。
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建机在海外：lockfile 里的 npmmirror 换回官方源，Maven 直连 Central。
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 部署服务器常在内网，直连 Docker Hub 被阻断或极慢；把同一份镜像同步到
      # GitHub Container Registry（按 digest 一致，不用重新构建），部署方改拉
      # ghcr.io/cosolar/minidesk:<tag> 即可。
      - name: Mirror image to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          echo "$SOURCE_TAGS" | tr ',' '\n' | while read -r src; do
            [ -z "$src" ] && continue
            tag="${src##*:}"
            echo "mirroring $src -> $GHCR_IMAGE:$tag"
            docker buildx imagetools create --tag "$GHCR_IMAGE:$tag" "$src"
          done

      # 让镜像包可被匿名拉取：部署服务器往往没有 GitHub 凭据。
      - name: Make the ghcr package pullable
        if: env.PUSH_IMAGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ github.repository_owner }}/minidesk
        run: |
          code=$(curl -sS -o /tmp/visibility.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/$PACKAGE_NAME/visibility" \
            -d '{"visibility":"public"}')
          echo "visibility api: $code"
          head -c 300 /tmp/visibility.json; echo
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/$PACKAGE_NAME" \
              -d '{"visibility":"public"}' | head -c 300; echo
          fi

      - name: Summarize
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            echo "已推送镜像：$IMAGE_NAME（tag 见上方 Build and push 输出）" >> "$GITHUB_STEP_SUMMARY"
            echo "已同步镜像：ghcr.io/${{ github.repository }}（内网服务器可从此拉取）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "仅验证构建，未推送。镜像名预留：$IMAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # 部署到服务器：构建好的镜像直接送到目标机加载并重启容器。
  # 不依赖目标机访问镜像仓库（境内直连 Docker Hub 常常被阻断或极慢）。
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to server
    needs: publish
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.push) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#v}"
          fi
          [ -z "$version" ] && version="latest"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 部署用的镜像带版本号与 latest 两个标签，服务器上可直接
      # docker run minimscn/minidesk:latest 复用，无需再构建。
      - name: Build the deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            minimscn/minidesk:latest
            minimscn/minidesk:${{ steps.ver.outputs.version }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha

      - name: Prepare the ssh key on the runner
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 首选让服务器直接从 ghcr.io 拉：走 GitHub 的 CDN，境内速度远好于
      # 从境外 runner 传 300MB 归档。拉不到时才回退到打包传输。
      - name: Pull the image on the server
        id: pull
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "REPO='${{ github.repository }}'; VER='${{ steps.ver.outputs.version }}'; \
             if docker pull ghcr.io/\$REPO:\$VER; then SRC=ghcr.io/\$REPO:\$VER; \
             else docker pull ghcr.io/\$REPO:latest && SRC=ghcr.io/\$REPO:latest; fi; \
             docker tag \$SRC minimscn/minidesk:latest; \
             docker tag \$SRC minimscn/minidesk:\$VER; \
             echo 'pulled='\$SRC" \
            && echo "pulled=true" >> "$GITHUB_OUTPUT" \
            || echo "pulled=false" >> "$GITHUB_OUTPUT"

      - name: Ship the image archive as a fallback
        if: steps.pull.outputs.pulled != 'true'
        run: |
          docker save minimscn/minidesk:latest minimscn/minidesk:${{ steps.ver.outputs.version }} \
            | gzip -1 > minidesk-image.tar.gz
          echo "image archive: $(du -h minidesk-image.tar.gz | cut -f1)"
          scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            minidesk-image.tar.gz deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/deploy.sh /tmp/minidesk-image.tar.gz '$DEPLOY_PATH'"

      - name: Roll the container on the server
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             docker compose -f deploy/docker-compose.yml up -d --force-recreate --pull never && \
             docker compose -f deploy/docker-compose.yml ps"

      - name: Verify the deployment
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose -f deploy/docker-compose.yml ps && \
             port=\$(grep -E '^MINIDESK_PORT=' deploy/.env | cut -d= -f2); \
             curl -fsS -o /dev/null -w 'health=%{http_code}\n' http://127.0.0.1:\${port:-18080}/api/auth/register-config"

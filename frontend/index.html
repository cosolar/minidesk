<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5FAF8" />
    <meta name="description" content="MiniDesk 极简工作台 · 让工作更高效，让生活更简单" />
    <title>极简工作台 · MiniDesk</title>
    <script>
      // 首屏前应用主题，避免暗色模式闪白
      ;(function () {
        try {
          var saved = localStorage.getItem('minidesk:theme')
          var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var mode = saved === 'dark' || saved === 'light' ? saved : sysDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = mode
          if (mode === 'dark') {
            document.documentElement.style.backgroundColor = '#121A18'
          }
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，忽略 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
